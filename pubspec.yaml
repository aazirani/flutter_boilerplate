name: flutter_boilerplate
description: A Flutter boilerplate with Clean Architecture, Riverpod, GoRouter, and Material 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^17.1.0

  # Dependency injection
  get_it: ^9.2.0

  # Local database
  drift: ^2.26.0
  drift_flutter: ^0.2.4

  # Storage
  shared_preferences: ^2.5.2

  # UI
  google_fonts: ^8.0.2

  # Internationalization
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.26.0

  # Tooling
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/lang/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn[wght].ttf

flutter_native_splash:
  color: "#6750A4"
  image: ""
  # To generate splash screens, provide an image path and run:
  # dart run flutter_native_splash:create

flutter_launcher_icons:
  android: true
  ios: true
  macos: true
  image_path: ""
  # To generate app icons, provide a 1024x1024 PNG path and run:
  # dart run flutter_launcher_icons
