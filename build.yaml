# Drift runs in its own target first, so other generators (Riverpod) can see
# the row classes it generates. See:
# https://drift.simonbinder.eu/generation_options/in_other_builders/
targets:
  drift:
    auto_apply_builders: false
    builders:
      drift_dev:analyzer:
        enabled: true
        options: &options
          has_separate_analyzer: true
      drift_dev:not_shared:
        enabled: true
        options: *options

  $default:
    dependencies:
      - ":drift"
    builders:
      drift_dev:
        enabled: false
